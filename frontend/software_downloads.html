<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2996861558693224"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Downloads — Architect Johan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #02040A;
            color: #00FFB3;
            overflow-x: hidden;
            min-height: 100vh;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Matrix background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(2, 4, 10, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid #00FFB3;
            padding: 20px 40px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 255, 179, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 255, 179, 0.8);
            background: linear-gradient(135deg, #00FFB3 0%, #2EC6FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #00FFB3;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #2EC6FF;
            text-shadow: 0 0 10px rgba(46, 198, 255, 0.8);
        }

        .nav-links a.active {
            color: #2EC6FF;
            background: rgba(46, 198, 255, 0.1);
            box-shadow: 0 0 15px rgba(46, 198, 255, 0.5);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: #2EC6FF;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* Main content */
        .main-content {
            position: relative;
            z-index: 10;
            padding: 120px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 179, 0.8);
        }

        .page-header p {
            font-size: 18px;
            color: #2EC6FF;
            letter-spacing: 1px;
        }

        /* Software grid */
        .software-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .software-card {
            background: rgba(2, 4, 10, 0.9);
            border: 2px solid #00FFB3;
            border-radius: 15px;
            padding: 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .software-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 179, 0.1), transparent);
            transition: left 0.5s;
        }

        .software-card:hover::before {
            left: 100%;
        }

        .software-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 255, 179, 0.3);
            border-color: #2EC6FF;
        }

        .software-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 179, 0.5));
        }

        .software-title {
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .software-description {
            color: #2EC6FF;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .software-features {
            list-style: none;
            margin-bottom: 25px;
        }

        .software-features li {
            color: #00FFB3;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .software-features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #2EC6FF;
            font-weight: bold;
        }

        .purchase-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #02040A;
            border: none;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .purchase-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .purchase-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .purchase-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 165, 0, 0.5);
        }

        .purchase-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .owned-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 255, 179, 0.2);
            border: 1px solid #00FFB3;
            color: #00FFB3;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00FFB3 0%, #2EC6FF 100%);
            color: #02040A;
            border: none;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 255, 179, 0.5);
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 10, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            color: #00FFB3;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            top: 100px;
            right: 40px;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 2000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: rgba(0, 255, 179, 0.2);
            border: 1px solid #00FFB3;
            color: #00FFB3;
        }

        .toast.error {
            background: rgba(255, 0, 76, 0.2);
            border: 1px solid #FF004C;
            color: #FF004C;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 12px;
                padding: 6px 12px;
            }

            .main-content {
                padding: 100px 20px 20px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .software-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .software-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">Architect Johan</div>
    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="videos.html">Videos</a>
        <a href="practice_set.html">Practice</a>
        <a href="software_downloads.html" class="active">Software</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="page-header">
        <h1>Software Downloads</h1>
        <p>Premium tools and resources for cybersecurity professionals</p>
    </div>

    <div class="software-grid" id="software-grid">
        <!-- Software cards will be loaded here -->
    </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay">
    <div class="loading-text">Loading Software...</div>
</div>

<!-- Toast notifications -->
<div class="toast" id="toast"></div>

<script>
    // Matrix background animation
    (function initMatrix() {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        let drops = [];

        function reset() {
            drops = Array.from({ length: Math.floor(canvas.width / fontSize) }, () => Math.random() * -100);
        }
        reset();
        window.addEventListener('resize', reset);

        setInterval(() => {
            ctx.fillStyle = 'rgba(2,4,10,0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00FFB3';
            ctx.font = fontSize + 'px monospace';

            drops.forEach((d, i) => {
                const char = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(char, i * fontSize, d * fontSize);

                if (d * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            });
        }, 50);
    })();

    const API_BASE_URL = 'https://architect-johan-secure.onrender.com';

    // Software modules data
    const softwareModules = [
        {
            id: 'ceh_tools_pack',
            title: 'CEH Tools Pack',
            description: 'Complete toolkit for Certified Ethical Hacker certification preparation',
            icon: '🛠️',
            features: [
                'Network scanning tools',
                'Vulnerability assessment',
                'Password cracking utilities',
                'Wireless security tools',
                'Web application testing'
            ],
            downloadUrl: 'https://example.com/download/ceh-tools-pack.zip'
        },
        {
            id: 'penetration_testing_suite',
            title: 'Penetration Testing Suite',
            description: 'Advanced penetration testing framework with automated scripts',
            icon: '🎯',
            features: [
                'Automated vulnerability scanning',
                'Exploit development framework',
                'Post-exploitation tools',
                'Reporting templates',
                'Custom script library'
            ],
            downloadUrl: 'https://example.com/download/pentest-suite.zip'
        },
        {
            id: 'network_security_analyzer',
            title: 'Network Security Analyzer',
            description: 'Comprehensive network security assessment and monitoring tool',
            icon: '🌐',
            features: [
                'Real-time network monitoring',
                'Traffic analysis',
                'Intrusion detection',
                'Security policy compliance',
                'Automated reporting'
            ],
            downloadUrl: 'https://example.com/download/network-analyzer.zip'
        },
        {
            id: 'web_security_scanner',
            title: 'Web Security Scanner',
            description: 'Advanced web application security testing and vulnerability assessment',
            icon: '🔒',
            features: [
                'OWASP Top 10 scanning',
                'SQL injection detection',
                'XSS vulnerability testing',
                'CSRF protection analysis',
                'Security headers audit'
            ],
            downloadUrl: 'https://example.com/download/web-scanner.zip'
        },
        {
            id: 'forensic_toolkit',
            title: 'Digital Forensics Toolkit',
            description: 'Professional digital forensics and incident response tools',
            icon: '🔍',
            features: [
                'Disk imaging utilities',
                'Memory forensics',
                'File system analysis',
                'Timeline reconstruction',
                'Evidence collection'
            ],
            downloadUrl: 'https://example.com/download/forensics-toolkit.zip'
        },
        {
            id: 'cryptography_suite',
            title: 'Cryptography Suite',
            description: 'Complete cryptography toolkit for encryption, decryption, and analysis',
            icon: '🔐',
            features: [
                'Symmetric encryption tools',
                'Asymmetric cryptography',
                'Hash function utilities',
                'Certificate management',
                'Cryptanalysis tools'
            ],
            downloadUrl: 'https://example.com/download/crypto-suite.zip'
        }
    ];

    let purchasedModules = [];

    // Load purchased modules and render software grid
    async function loadSoftwarePage() {
        try {
            // Check authentication
            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            // Load purchased modules
            await loadPurchasedModules();

            // Render software grid
            renderSoftwareGrid();

            // Hide loading overlay
            document.getElementById('loading-overlay').style.display = 'none';

        } catch (error) {
            console.error('Error loading software page:', error);
            showToast('Failed to load software page. Please try again.', 'error');
        }
    }

    // Load user's purchased modules
    async function loadPurchasedModules() {
        try {
            const token = localStorage.getItem('auth_token');
            const response = await fetch(`${API_BASE_URL}/api/get-purchased-modules`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                purchasedModules = data.purchased_modules || [];
            } else {
                console.warn('Failed to load purchased modules, assuming none purchased');
                purchasedModules = [];
            }
        } catch (error) {
            console.error('Error loading purchased modules:', error);
            purchasedModules = [];
        }
    }

    // Render software grid
    function renderSoftwareGrid() {
        const grid = document.getElementById('software-grid');

        softwareModules.forEach(module => {
            const isOwned = purchasedModules.includes(module.id);

            const card = document.createElement('div');
            card.className = 'software-card';

            card.innerHTML = `
                ${isOwned ? '<div class="owned-badge">OWNED</div>' : ''}
                <div class="software-icon">${module.icon}</div>
                <div class="software-title">${module.title}</div>
                <div class="software-description">${module.description}</div>
                <ul class="software-features">
                    ${module.features.map(feature => `<li>${feature}</li>`).join('')}
                </ul>
                ${isOwned ?
                    `<a href="${module.downloadUrl}" class="download-btn" target="_blank">📥 Download Now</a>` :
                    `<button class="purchase-btn" onclick="initiatePurchase('${module.id}', '${module.title}', '${module.downloadUrl}')">
                        🛒 Purchase ₹1
                    </button>`
                }
            `;

            grid.appendChild(card);
        });
    }

    // Initiate purchase process
    function initiatePurchase(moduleId, moduleTitle, downloadUrl) {
        // Store purchase data in sessionStorage
        const purchaseData = {
            moduleId: moduleId,
            moduleTitle: moduleTitle,
            downloadUrl: downloadUrl,
            timestamp: Date.now()
        };

        sessionStorage.setItem('pending_purchase', JSON.stringify(purchaseData));

        // Redirect to payment page
        window.location.href = 'payment.html';
    }

    // Logout function
    function logout() {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('full_name');
        localStorage.removeItem('email');
        localStorage.removeItem('purchased_modules');
        window.location.href = 'index.html';
    }

    // Toast notification
    function showToast(message, type) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => {
            toast.className = 'toast';
        }, 4000);
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', loadSoftwarePage);
</script>

</body>
</html>
