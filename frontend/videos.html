<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Johan — Secure Video Player</title>
    <style>
        /* ===========================================
           SECURITY BASE STYLES
        =========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            cursor: default;
        }

        /* Prevent all text selection */
        *::selection {
            background: transparent;
        }
        *::-moz-selection {
            background: transparent;
        }

        /* ===========================================
           SECURITY OVERLAYS
        =========================================== */
        #security-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2147483647; /* Maximum z-index */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff0000;
            font-size: 24px;
            text-align: center;
            padding: 20px;
        }

        #security-screen.hidden {
            display: none;
        }

        #invisible-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2147483646;
            background: transparent;
            pointer-events: none;
        }

        #watermark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2147483645;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 50px,
                rgba(255, 0, 0, 0.02) 50px,
                rgba(255, 0, 0, 0.02) 51px
            );
            opacity: 0.1;
        }

        /* ===========================================
           VIDEO CONTAINER
        =========================================== */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            position: relative;
            background: #000;
        }

        /* ===========================================
           LOADING SCREEN
        =========================================== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff00;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #00ff00;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===========================================
           CONTROLS
        =========================================== */
        #video-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 10px 20px;
            z-index: 100;
            display: flex;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #video-controls:hover {
            opacity: 1;
        }

        .control-btn {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(0, 255, 0, 0.2);
        }

        /* ===========================================
           SECURITY WARNINGS
        =========================================== */
        .security-warning {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            display: none;
            animation: warning-blink 1s infinite;
        }

        @keyframes warning-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===========================================
           PASSWORD MODAL
        =========================================== */
        #password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2147483640;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .password-box {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 15px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.3);
        }

        .password-title {
            color: #00ff00;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .password-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 8px;
            color: #00ff00;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            text-align: center;
            letter-spacing: 2px;
        }

        .password-input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .password-error {
            color: #ff0000;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .password-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .password-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            min-width: 120px;
            transition: all 0.3s;
        }

        .password-submit {
            background: #00ff00;
            color: #000;
        }

        .password-submit:hover {
            background: #00cc00;
            transform: translateY(-2px);
        }

        .password-cancel {
            background: rgba(255, 0, 0, 0.1);
            color: #ff0000;
            border: 1px solid #ff0000;
        }

        .password-cancel:hover {
            background: rgba(255, 0, 0, 0.2);
        }

        /* ===========================================
           INFO DISPLAY
        =========================================== */
        #video-info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 12px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
            display: none;
        }
    </style>
    <!-- No external dependencies -->
</head>
<body>
    <!-- Security Screen (Shows when recording/screenshot detected) -->
    <div id="security-screen">
        <div style="margin-bottom: 30px; font-size: 48px;">⚠️</div>
        <h2 style="margin-bottom: 20px;">SECURITY VIOLATION DETECTED</h2>
        <p style="margin-bottom: 10px; font-size: 18px;">Screen recording or screenshot detected</p>
        <p style="font-size: 14px; opacity: 0.8;">Video playback has been suspended</p>
        <p style="font-size: 12px; margin-top: 30px; opacity: 0.6;">This incident has been logged</p>
    </div>

    <!-- Invisible overlay for event blocking -->
    <div id="invisible-overlay"></div>

    <!-- Watermark overlay -->
    <div id="watermark-overlay"></div>

    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <p>Initializing secure video player...</p>
        <p style="font-size: 12px; margin-top: 10px; opacity: 0.7;">Security systems: ONLINE</p>
    </div>

    <!-- Password modal -->
    <div id="password-modal">
        <div class="password-box">
            <h3 class="password-title">Secure Access Required</h3>
            <input type="password" class="password-input" id="video-password" 
                   placeholder="Enter security passcode" autocomplete="off" spellcheck="false">
            <div class="password-error" id="password-error">Access denied</div>
            <div class="password-buttons">
                <button class="password-btn password-cancel" id="password-cancel">Cancel</button>
                <button class="password-btn password-submit" id="password-submit">Decrypt Video</button>
            </div>
        </div>
    </div>

    <!-- Video container -->
    <div id="video-container">
        <div id="video-wrapper">
            <!-- Video will be loaded here -->
        </div>
    </div>

    <!-- Video controls -->
    <div id="video-controls">
        <button class="control-btn" id="play-btn">▶ Play</button>
        <button class="control-btn" id="pause-btn">⏸ Pause</button>
        <button class="control-btn" id="fullscreen-btn">⛶ Fullscreen</button>
        <button class="control-btn" id="logout-btn">🚪 Exit</button>
    </div>

    <!-- Security warning -->
    <div class="security-warning" id="security-warning"></div>

    <!-- Video info -->
    <div id="video-info"></div>

    <script>
    // ===========================================
    // SECURITY CONFIGURATION
    // ===========================================
    const SECURITY = {
        API_URL: 'https://architect-johan-secure.onrender.com',
        VIDEO_ID: 'ceh_v13_main',
        MAX_ATTEMPTS: 3,
        SESSION_TIMEOUT: 3600, // 1 hour
        CHECK_INTERVAL: 1000, // Security checks every second
        BLACKSCREEN_DELAY: 500 // Delay before black screen
    };

    // ===========================================
    // SECURITY STATE
    // ===========================================
    let securityState = {
        violations: 0,
        recordingDetected: false,
        screenshotDetected: false,
        devToolsOpen: false,
        accessToken: null,
        videoLoaded: false,
        lastActivity: Date.now()
    };

    // ===========================================
    // CORE SECURITY FUNCTIONS
    // ===========================================
    
    // Block ALL keyboard shortcuts
    function blockAllShortcuts() {
        const blockedKeys = new Set([
            112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, // F1-F12
            44, 45, 46, // Print Screen, Insert, Delete
            91, 92, 93, // Windows/Command keys
            144, 145 // Num Lock, Scroll Lock
        ]);

        document.addEventListener('keydown', function(e) {
            // Block Ctrl, Alt, Shift combinations
            if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                logSecurityEvent('keyboard_shortcut_blocked', { key: e.key, code: e.keyCode });
                return false;
            }

            // Block specific keys
            if (blockedKeys.has(e.keyCode)) {
                e.preventDefault();
                e.stopPropagation();
                logSecurityEvent('function_key_blocked', { key: e.key, code: e.keyCode });
                return false;
            }

            // Block DevTools shortcuts
            if ((e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                e.stopPropagation();
                showSecurityAlert('Developer tools are disabled');
                return false;
            }
        }, true);
    }

    // Block ALL mouse events
    function blockMouseEvents() {
        const overlay = document.getElementById('invisible-overlay');
        
        overlay.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            logSecurityEvent('right_click_blocked');
            return false;
        }, true);

        overlay.addEventListener('mousedown', function(e) {
            if (e.button === 2) { // Right click
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);
    }

    // Detect screen recording/screenshots
    function setupRecordingDetection() {
        // Method 1: Detect display capture API
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            const originalGetDisplayMedia = navigator.mediaDevices.getDisplayMedia;
            navigator.mediaDevices.getDisplayMedia = function(constraints) {
                logSecurityEvent('screen_capture_attempted');
                showBlackScreen();
                return Promise.reject(new Error('Screen capture not allowed'));
            };
        }

        // Method 2: Detect fullscreen changes
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        // Method 3: Visibility API detection
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                logSecurityEvent('tab_hidden');
                showBlackScreen();
            }
        });

        // Method 4: Detect known recording extensions
        detectRecordingExtensions();
    }

    function handleFullscreenChange() {
        if (!document.fullscreenElement && 
            !document.webkitFullscreenElement && 
            !document.mozFullScreenElement && 
            !document.msFullscreenElement) {
            logSecurityEvent('fullscreen_exit_detected');
            setTimeout(() => {
                if (!document.fullscreenElement && securityState.videoLoaded) {
                    showBlackScreen();
                }
            }, 100);
        }
    }

    function detectRecordingExtensions() {
        const knownExtensions = [
            'screen-recorder',
            'screenshot',
            'record',
            'capture',
            'nimbus',
            'lighthshot',
            'awesome',
            'picpick',
            'sharex',
            'greenshot'
        ];

        // Check for extension injection
        knownExtensions.forEach(ext => {
            const testElement = document.createElement('div');
            testElement.className = ext + '-test';
            document.body.appendChild(testElement);
            
            setTimeout(() => {
                const styles = window.getComputedStyle(testElement);
                if (styles.display === 'none' || styles.visibility === 'hidden') {
                    logSecurityEvent('recording_extension_detected', { extension: ext });
                    showBlackScreen();
                }
                testElement.remove();
            }, 100);
        });
    }

    // Detect Developer Tools
    function detectDevTools() {
        const widthThreshold = window.outerWidth - window.innerWidth > 160;
        const heightThreshold = window.outerHeight - window.innerHeight > 160;
        
        if (widthThreshold || heightThreshold) {
            if (!securityState.devToolsOpen) {
                securityState.devToolsOpen = true;
                logSecurityEvent('devtools_opened');
                showBlackScreen();
            }
        } else {
            securityState.devToolsOpen = false;
        }
    }

    // Show black screen
    function showBlackScreen() {
        securityState.recordingDetected = true;
        const securityScreen = document.getElementById('security-screen');
        securityScreen.classList.remove('hidden');
        
        // Hide video
        document.getElementById('video-wrapper').innerHTML = '';
        
        // Log violation
        securityState.violations++;
        logSecurityEvent('security_violation', {
            type: 'screen_capture',
            violations: securityState.violations
        });
        
        // Send to server
        fetch(`${SECURITY.API_URL}/api/security/log-event`, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('auth_token'),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                event_type: 'screen_capture_detected',
                event_data: {
                    violations: securityState.violations,
                    timestamp: new Date().toISOString()
                },
                severity: 'high'
            })
        }).catch(() => {});
        
        // Lock further access if too many violations
        if (securityState.violations >= 3) {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('video_access_token');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        }
    }

    // Hide black screen
    function hideBlackScreen() {
        const securityScreen = document.getElementById('security-screen');
        securityScreen.classList.add('hidden');
    }

    // Add dynamic watermark
    function addDynamicWatermark() {
        const userId = localStorage.getItem('user_id') || 'unknown';
        const watermark = document.getElementById('watermark-overlay');
        
        // Create canvas for dynamic watermark
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        function drawWatermark() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw timestamp
            const now = new Date();
            const timestamp = now.toISOString();
            const text = `USER:${userId} | ${timestamp} | ${window.location.hostname}`;
            
            ctx.font = '14px monospace';
            ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
            ctx.textAlign = 'center';
            
            // Draw text in grid pattern
            for (let x = 100; x < canvas.width; x += 300) {
                for (let y = 100; y < canvas.height; y += 100) {
                    ctx.fillText(text, x, y);
                }
            }
            
            // Update watermark overlay
            watermark.style.backgroundImage = `url(${canvas.toDataURL()})`;
        }
        
        // Update watermark every second
        setInterval(drawWatermark, 1000);
        drawWatermark();
        
        // Update on resize
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawWatermark();
        });
    }

    // ===========================================
    // VIDEO FUNCTIONS
    // ===========================================
    
    // Decrypt video from server
    async function loadVideoFromServer() {
        try {
            const token = localStorage.getItem('auth_token');
            if (!token) throw new Error('No authentication token');
            
            // Check if user has access
            const response = await fetch(`${SECURITY.API_URL}/api/security/get-video-token`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    video_id: SECURITY.VIDEO_ID,
                    access_token: localStorage.getItem('video_access_token')
                })
            });
            
            if (response.ok) {
                const data = await response.json();
                if (data.embed) {
                    // Simple XOR decryption
                    function simpleDecrypt(encrypted, key) {
                        const decoded = atob(encrypted);
                        let decrypted = '';
                        for (let i = 0; i < decoded.length; i++) {
                            const keyChar = key[i % key.length];
                            decrypted += String.fromCharCode(decoded.charCodeAt(i) ^ keyChar.charCodeAt(0));
                        }
                        return decrypted;
                    }
                    
                    const decrypted = simpleDecrypt(data.embed.encrypted, data.embed.key);
                    return decrypted;
                }
            }
            return null;
        } catch (error) {
            console.error('Error loading video:', error);
            return null;
        }
    }

    // Display video
    async function displayVideo() {
        const videoWrapper = document.getElementById('video-wrapper');
        const embedCode = await loadVideoFromServer();
        
        if (embedCode) {
            videoWrapper.innerHTML = embedCode;
            securityState.videoLoaded = true;
            hideLoadingScreen();
            
            // Add event listeners to iframe
            const iframe = videoWrapper.querySelector('iframe');
            if (iframe) {
                iframe.onload = function() {
                    logSecurityEvent('video_loaded');
                };
                
                // Prevent iframe from being accessed
                Object.defineProperty(iframe, 'src', {
                    writable: false,
                    configurable: false
                });
            }
        } else {
            showPasswordModal();
        }
    }

    // ===========================================
    // AUTHENTICATION & ACCESS
    // ===========================================
    
    function checkAuthentication() {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = 'index.html';
            return false;
        }
        
        // Verify token with server
        fetch(`${SECURITY.API_URL}/api/validate-token`, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            }
        }).then(response => {
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }).catch(() => {
            localStorage.clear();
            window.location.href = 'index.html';
        });
        
        return true;
    }

    // ===========================================
    // UI FUNCTIONS
    // ===========================================
    
    function showPasswordModal() {
        document.getElementById('password-modal').style.display = 'flex';
        document.getElementById('video-password').focus();
    }

    function hidePasswordModal() {
        document.getElementById('password-modal').style.display = 'none';
        document.getElementById('video-password').value = '';
        document.getElementById('password-error').style.display = 'none';
    }

    async function verifyPassword() {
        const password = document.getElementById('video-password').value;
        const errorElement = document.getElementById('password-error');
        
        if (!password) {
            errorElement.textContent = 'Password required';
            errorElement.style.display = 'block';
            return;
        }
        
        try {
            const token = localStorage.getItem('auth_token');
            const response = await fetch(`${SECURITY.API_URL}/api/security/verify-video-access`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    video_id: SECURITY.VIDEO_ID,
                    password: password
                })
            });
            
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('video_access_token', data.access_token);
                hidePasswordModal();
                await displayVideo();
            } else {
                const data = await response.json();
                errorElement.textContent = data.error || 'Access denied';
                errorElement.style.display = 'block';
                logSecurityEvent('password_failed');
            }
        } catch (error) {
            errorElement.textContent = 'Network error';
            errorElement.style.display = 'block';
        }
    }

    function showLoadingScreen() {
        document.getElementById('loading-screen').style.display = 'flex';
    }

    function hideLoadingScreen() {
        document.getElementById('loading-screen').style.display = 'none';
    }

    function showSecurityAlert(message) {
        const warning = document.getElementById('security-warning');
        warning.textContent = message;
        warning.style.display = 'block';
        
        setTimeout(() => {
            warning.style.display = 'none';
        }, 3000);
    }

    // ===========================================
    // LOGGING
    // ===========================================
    
    function logSecurityEvent(eventType, data = {}) {
        console.log(`[SECURITY] ${eventType}:`, data);
        
        // Send to server
        const token = localStorage.getItem('auth_token');
        if (token) {
            fetch(`${SECURITY.API_URL}/api/security/log-event`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: eventType,
                    event_data: data,
                    user_agent: navigator.userAgent,
                    severity: ['devtools_opened', 'screen_capture_detected'].includes(eventType) ? 'high' : 'medium'
                })
            }).catch(() => {});
        }
    }

    // ===========================================
    // INITIALIZATION
    // ===========================================
    
    document.addEventListener('DOMContentLoaded', async function() {
        // Check authentication
        if (!checkAuthentication()) return;
        
        // Initialize security systems
        blockAllShortcuts();
        blockMouseEvents();
        setupRecordingDetection();
        addDynamicWatermark();
        
        // Start security monitoring
        setInterval(detectDevTools, SECURITY.CHECK_INTERVAL);
        
        // Setup event listeners
        document.getElementById('password-submit').addEventListener('click', verifyPassword);
        document.getElementById('password-cancel').addEventListener('click', hidePasswordModal);
        
        document.getElementById('video-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPassword();
        });
        
        // Setup control buttons
        document.getElementById('play-btn').addEventListener('click', function() {
            const iframe = document.querySelector('iframe');
            if (iframe) iframe.contentWindow.postMessage('{"event":"command","func":"playVideo"}', '*');
        });
        
        document.getElementById('pause-btn').addEventListener('click', function() {
            const iframe = document.querySelector('iframe');
            if (iframe) iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo"}', '*');
        });
        
        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            const videoContainer = document.getElementById('video-container');
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen();
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen();
            } else if (videoContainer.mozRequestFullScreen) {
                videoContainer.mozRequestFullScreen();
            } else if (videoContainer.msRequestFullscreen) {
                videoContainer.msRequestFullscreen();
            }
        });
        
        document.getElementById('logout-btn').addEventListener('click', function() {
            if (confirm('Exit secure video player?')) {
                localStorage.removeItem('video_access_token');
                window.location.href = 'home.html';
            }
        });
        
        // Auto-hide controls
        let controlsTimeout;
        document.addEventListener('mousemove', function() {
            const controls = document.getElementById('video-controls');
            controls.style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                controls.style.opacity = '0';
            }, 3000);
        });
        
        // Try to load video
        await displayVideo();
        
        // Log page access
        logSecurityEvent('secure_video_page_loaded');
    });

    // Prevent leaving page
    window.addEventListener('beforeunload', function(e) {
        if (securityState.videoLoaded) {
            e.preventDefault();
            e.returnValue = 'Video is playing. Are you sure you want to leave?';
            return e.returnValue;
        }
    });

    // Clean up on exit
    window.addEventListener('unload', function() {
        localStorage.removeItem('video_access_token');
        logSecurityEvent('session_ended');
    });
    </script>
</body>
</html>
