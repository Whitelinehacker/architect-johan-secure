<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Johan — Video Courses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Matrix background - subtle */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.05;
        }

        /* Main content container */
        .content-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar - YouTube style */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #0f0f0f;
            padding: 0 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00FFB3;
            letter-spacing: 1px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .center-section {
            flex: 1;
            max-width: 640px;
            margin: 0 80px;
        }

        .search-container {
            display: flex;
            width: 100%;
        }

        .search-input {
            flex: 1;
            padding: 0 16px;
            background: #121212;
            border: 1px solid #303030;
            border-right: none;
            border-radius: 40px 0 0 40px;
            color: #fff;
            font-size: 16px;
            height: 40px;
        }

        .search-input:focus {
            outline: none;
            border-color: #1c62b9;
        }

        .search-btn {
            background: #222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: #fff;
            padding: 0 20px;
            cursor: pointer;
            height: 40px;
        }

        .search-btn:hover {
            background: #303030;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00FFB3, #2EC6FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 56px;
            width: 240px;
            height: calc(100vh - 56px);
            background: #0f0f0f;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 0;
            overflow-y: auto;
            z-index: 90;
            transition: transform 0.3s ease;
        }

        .sidebar-hidden {
            transform: translateX(-100%);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 40px;
            color: #fff;
            text-decoration: none;
            transition: background 0.2s;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar-item.active {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 500;
        }

        .sidebar-item i {
            margin-right: 24px;
            font-size: 18px;
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 12px 24px;
        }

        .sidebar-section-title {
            padding: 8px 24px;
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main content */
        .main-content {
            margin-left: 240px;
            margin-top: 56px;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }

        .sidebar-hidden + .main-content {
            margin-left: 0;
        }

        /* Categories bar */
        .categories-bar {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            overflow-x: auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
            scrollbar-width: none;
        }

        .categories-bar::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-chip:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .category-chip.active {
            background: #fff;
            color: #0f0f0f;
            font-weight: 500;
        }

        /* Video grid - YouTube style */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            padding: 0 8px;
        }

        .video-card {
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, background 0.3s ease;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.05);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .video-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .video-info {
            padding: 0 4px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .video-channel {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00FFB3, #2EC6FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .channel-name {
            color: #aaa;
            font-size: 14px;
        }

        .locked-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 107, 107, 0.9);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .play-btn-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 179, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-card:hover .play-btn-overlay {
            opacity: 1;
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 12px;
        }

        .skeleton-thumbnail {
            width: 100%;
            padding-bottom: 56.25%;
            margin-bottom: 12px;
        }

        .skeleton-title {
            height: 20px;
            width: 80%;
            margin-bottom: 8px;
        }

        .skeleton-meta {
            height: 16px;
            width: 60%;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Password Modal */
        .password-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .password-modal-overlay.show {
            display: flex;
        }

        .password-modal {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 32px;
            width: 400px;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .password-modal h3 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }

        .password-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: #0f0f0f;
            border: 1px solid #303030;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
        }

        .password-input:focus {
            outline: none;
            border-color: #00FFB3;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .modal-submit {
            background: #00FFB3;
            color: #000;
        }

        .modal-submit:hover {
            background: #2EC6FF;
        }

        .modal-cancel {
            background: transparent;
            color: #fff;
            border: 1px solid #303030;
        }

        .modal-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00FFB3, #2EC6FF);
            transform-origin: 0%;
            z-index: 101;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.show {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 12px;
            }
            
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 16px;
            }
            
            .center-section {
                margin: 0 16px;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            
            .search-input {
                display: none;
            }
            
            .search-btn {
                background: transparent;
                border: none;
                font-size: 20px;
            }
        }
    </style>

    <script>
    // Matrix animation
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$+-*/=%"#&_(),.;:?!\\|{}<>[]^~';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    
    function drawMatrix() {
        ctx.fillStyle = 'rgba(15, 15, 15, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#00FFB3';
        ctx.font = `${fontSize}px monospace`;
        
        for (let i = 0; i < drops.length; i++) {
            const text = letters[Math.floor(Math.random() * letters.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;
            
            ctx.fillText(text, x, y);
            
            if (y > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    
    setInterval(drawMatrix, 50);
    
    // Window resize handler
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    // DOM Elements
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('main-content');
    const userProfile = document.getElementById('user-profile');
    const searchInput = document.querySelector('.search-input');
    const searchBtn = document.querySelector('.search-btn');
    const categoryChips = document.querySelectorAll('.category-chip');
    const videoGrid = document.getElementById('video-grid');
    const passwordModal = document.getElementById('password-modal');
    const progressBar = document.getElementById('progress-bar');

    // Mock video data
    const videoData = {
        ceh: [
            {
                id: 'ceh1',
                title: 'CEH v13: Introduction to Ethical Hacking',
                description: 'Learn the fundamentals of ethical hacking and penetration testing',
                duration: '2:15:30',
                views: '15.2K',
                date: '2 weeks ago',
                thumbnail: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&h=225&fit=crop',
                locked: false,
                category: 'ceh',
                level: 'Beginner',
                channel: 'Architect Johan'
            },
            {
                id: 'ceh2',
                title: 'Footprinting and Reconnaissance Techniques',
                description: 'Master information gathering and OSINT techniques',
                duration: '3:45:22',
                views: '8.7K',
                date: '1 month ago',
                thumbnail: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&h=225&fit=crop',
                locked: true,
                category: 'ceh',
                level: 'Intermediate',
                channel: 'Architect Johan'
            }
        ],
        web: [
            {
                id: 'web1',
                title: 'Web Application Security Fundamentals',
                description: 'Understanding OWASP Top 10 vulnerabilities',
                duration: '1:45:10',
                views: '22.5K',
                date: '3 days ago',
                thumbnail: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400&h=225&fit=crop',
                locked: false,
                category: 'web',
                level: 'Beginner',
                channel: 'Architect Johan'
            }
        ],
        network: [
            {
                id: 'net1',
                title: 'Network Scanning and Enumeration',
                description: 'Complete guide to Nmap and network scanning tools',
                duration: '4:20:15',
                views: '12.3K',
                date: '1 week ago',
                thumbnail: 'https://images.unsplash.com/photo-1547658719-da2b51169166?w-400&h=225&fit=crop',
                locked: false,
                category: 'network',
                level: 'Intermediate',
                channel: 'Architect Johan'
            }
        ],
        linux: [
            {
                id: 'linux1',
                title: 'Linux Security Hardening',
                description: 'Secure your Linux systems from attacks',
                duration: '2:30:45',
                views: '9.8K',
                date: '2 months ago',
                thumbnail: 'https://images.unsplash.com/photo-1504639725590-34d0984388bd?w=400&h=225&fit=crop',
                locked: false,
                category: 'linux',
                level: 'Advanced',
                channel: 'Architect Johan'
            }
        ]
    };

    // All videos
    const allVideos = Object.values(videoData).flat();

    // Current state
    let currentCategory = 'all';
    let currentVideo = null;

    // Authentication check
    function checkAuth() {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = 'index.html';
            return false;
        }
        return true;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        if (!checkAuth()) return;
        
        // Set username
        const username = localStorage.getItem('username') || 'AJ';
        const initials = username.substring(0, 2).toUpperCase();
        userProfile.textContent = initials;
        
        // Load videos
        renderVideos(allVideos);
        
        // Setup event listeners
        setupEventListeners();
        
        // Start progress animation
        simulateProgress();
    });

    function setupEventListeners() {
        // Menu toggle
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('show');
        });

        // Category chips
        categoryChips.forEach(chip => {
            chip.addEventListener('click', () => {
                categoryChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.dataset.category;
                filterVideos(currentCategory);
            });
        });

        // Sidebar category filters
        document.querySelectorAll('.sidebar-item[data-category]').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const category = item.dataset.category;
                categoryChips.forEach(c => c.classList.remove('active'));
                document.querySelector(`.category-chip[data-category="${category}"]`)?.classList.add('active');
                currentCategory = category;
                filterVideos(category);
            });
        });

        // Search functionality
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // User profile click
        userProfile.addEventListener('click', () => {
            window.location.href = 'profile.html';
        });

        // Sidebar logout
        document.getElementById('sidebar-logout').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        });

        // Password modal
        document.getElementById('password-cancel').addEventListener('click', () => {
            passwordModal.classList.remove('show');
            currentVideo = null;
        });

        document.getElementById('password-submit').addEventListener('click', verifyPassword);
        document.getElementById('video-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyPassword();
        });

        // Close modal on overlay click
        passwordModal.addEventListener('click', (e) => {
            if (e.target === passwordModal) {
                passwordModal.classList.remove('show');
                currentVideo = null;
            }
        });
    }

    function renderVideos(videos) {
        videoGrid.innerHTML = '';
        
        if (videos.length === 0) {
            videoGrid.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 60px; color: #aaa;">
                    <i class="fas fa-video-slash" style="font-size: 48px; margin-bottom: 20px;"></i>
                    <h3>No videos found</h3>
                    <p>Try selecting a different category</p>
                </div>
            `;
            return;
        }
        
        videos.forEach(video => {
            const videoCard = document.createElement('div');
            videoCard.className = 'video-card';
            videoCard.dataset.id = video.id;
            
            videoCard.innerHTML = `
                <div class="video-thumbnail">
                    <div style="background: linear-gradient(135deg, ${video.locked ? '#ff6b6b' : '#00FFB3'}, ${video.locked ? '#ff5252' : '#2EC6FF'}); width: 100%; height: 100%;"></div>
                    <div class="play-btn-overlay">
                        <i class="fas fa-play"></i>
                    </div>
                    ${video.locked ? '<div class="locked-badge"><i class="fas fa-lock"></i> Locked</div>' : ''}
                    <div class="video-duration">${video.duration}</div>
                </div>
                <div class="video-info">
                    <h3 class="video-title">${video.title}</h3>
                    <div class="video-meta">
                        <span>${video.views} views</span>
                        <span>•</span>
                        <span>${video.date}</span>
                    </div>
                    <div class="video-channel">
                        <div class="channel-avatar">${video.channel.substring(0, 2)}</div>
                        <span class="channel-name">${video.channel}</span>
                    </div>
                    <div class="video-meta">
                        <span>${video.level}</span>
                        <span>•</span>
                        <span>${video.category.toUpperCase()}</span>
                    </div>
                </div>
            `;
            
            videoCard.addEventListener('click', () => handleVideoClick(video));
            videoGrid.appendChild(videoCard);
        });
    }

    function filterVideos(category) {
        let filteredVideos = [];
        
        if (category === 'all') {
            filteredVideos = allVideos;
        } else {
            filteredVideos = allVideos.filter(video => video.category === category);
        }
        
        renderVideos(filteredVideos);
    }

    function performSearch() {
        const query = searchInput.value.toLowerCase().trim();
        
        if (query === '') {
            filterVideos(currentCategory);
            return;
        }
        
        const filteredVideos = allVideos.filter(video => 
            video.title.toLowerCase().includes(query) ||
            video.description.toLowerCase().includes(query) ||
            video.category.toLowerCase().includes(query)
        );
        
        renderVideos(filteredVideos);
        
        // Update category chips
        categoryChips.forEach(chip => chip.classList.remove('active'));
        document.querySelector('.category-chip[data-category="all"]').classList.add('active');
    }

    function handleVideoClick(video) {
        console.log('Video clicked:', video.id);
        
        if (video.locked) {
            currentVideo = video;
            document.getElementById('password-title').textContent = `Unlock: ${video.title}`;
            document.getElementById('video-password').value = '';
            document.getElementById('password-error').style.display = 'none';
            passwordModal.classList.add('show');
            document.getElementById('video-password').focus();
        } else {
            // Navigate to video player or category page
            window.location.href = `video-player.html?id=${video.id}`;
        }
    }

    async function verifyPassword() {
        const password = document.getElementById('video-password').value;
        const errorElement = document.getElementById('password-error');
        
        if (!password) {
            errorElement.textContent = 'Password is required';
            errorElement.style.display = 'block';
            return;
        }
        
        // Simulate API call
        setTimeout(() => {
            // Mock password verification (replace with real API call)
            const mockPassword = 'Arch1t3ch_Joh@N!X#2025';
            
            if (password === mockPassword) {
                passwordModal.classList.remove('show');
                // Unlock the video and navigate
                if (currentVideo) {
                    currentVideo.locked = false;
                    window.location.href = `video-player.html?id=${currentVideo.id}`;
                }
            } else {
                errorElement.textContent = 'Incorrect password. Please try again.';
                errorElement.style.display = 'block';
                document.getElementById('video-password').value = '';
            }
        }, 1000);
    }

    function simulateProgress() {
        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;
            progressBar.style.transform = `scaleX(${progress / 100})`;
            
            if (progress >= 100) {
                clearInterval(interval);
                progressBar.style.transform = 'scaleX(0)';
            }
        }, 50);
    }

    // Scroll progress indicator
    window.addEventListener('scroll', () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        progressBar.style.transform = `scaleX(${scrolled / 100})`;
    });

    // Auto-hide sidebar on mobile when clicking outside
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768 && 
            !sidebar.contains(e.target) && 
            !menuBtn.contains(e.target) && 
            sidebar.classList.contains('show')) {
            sidebar.classList.remove('show');
        }
    });
    </script>
</body>
