<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Johan — Accurate Secure Video Player</title>
    <style>
        /* ===========================================
           BASIC STYLES
        =========================================== */
        body {
            background: #000 !important;
            color: #fff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* BLACK SCREEN OVERLAY */
        #black-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 9999999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #ff0000;
            text-align: center;
            padding: 20px;
            font-family: 'Courier New', monospace;
        }

        #black-screen.active {
            display: flex;
        }

        .black-screen-text {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ff0000;
        }

        /* DEBUG PANEL */
        #debug-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 999999;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }

        #debug-panel {
            position: fixed;
            top: 50px;
            right: 10px;
            width: 300px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            z-index: 999998;
            display: none;
            font-family: monospace;
            font-size: 11px;
            color: #00ff00;
            max-height: 80vh;
            overflow-y: auto;
        }

        .debug-item {
            margin: 5px 0;
            padding: 3px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }

        .debug-item.success { color: #00ff00; }
        .debug-item.warning { color: #ffff00; }
        .debug-item.error { color: #ff0000; }

        /* PASSWORD MODAL */
        #password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 800000;
            backdrop-filter: blur(10px);
        }

        .password-box {
            background: rgba(20, 20, 20, 0.95);
            border: 3px solid #00ff00;
            border-radius: 15px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.3);
        }

        .password-input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        .error {
            color: #ff0000;
            margin: 15px 0;
            display: none;
            font-size: 14px;
        }

        /* LOADING SCREEN */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900000;
            color: #00ff00;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 0, 0.3);
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* VIDEO CONTAINER */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 100000;
        }

        #video-container.active {
            display: flex;
        }

        #video-wrapper {
            width: 95%;
            max-width: 1400px;
            height: 85vh;
            background: #000;
            border: 2px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
        }

        /* CONTROLS */
        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            display: none;
            gap: 15px;
            z-index: 200000;
        }

        #controls.active {
            display: flex;
        }

        .control-btn {
            background: linear-gradient(45deg, #00ff00, #00cc00);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
        }

        /* SECURITY INFO */
        #security-info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.1);
            font-size: 12px;
            z-index: 150000;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 5px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .password-box {
                padding: 30px 20px;
            }
            
            #video-wrapper {
                width: 98%;
                height: 75vh;
            }
            
            #debug-panel {
                width: 90%;
                right: 5%;
            }
        }

        .progress-container {
            width: 250px;
            height: 4px;
            background: rgba(0, 255, 0, 0.2);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        #load-progress {
            width: 0%;
            height: 100%;
            background: #00ff00;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <!-- DEBUG TOGGLE -->
    <button id="debug-toggle">🔧 DEBUG</button>
    <div id="debug-panel">
        <h4 style="margin-top: 0;">Detection Debug</h4>
        <div id="debug-log"></div>
    </div>

    <!-- BLACK SCREEN -->
    <div id="black-screen">
        <div class="black-screen-text">🚨 SECURITY ALERT</div>
        <div class="black-screen-subtext" id="detection-details">
            Recording attempt detected.
        </div>
        <div style="color: #666; font-size: 14px; margin-top: 20px;">
            Auto-resume in <span id="resume-timer">30</span> seconds
        </div>
    </div>

    <!-- PASSWORD MODAL -->
    <div id="password-modal">
        <div class="password-box">
            <h2>🔐 SECURE ACCESS</h2>
            <p>Enter password to watch video</p>
            <input type="password" 
                   class="password-input" 
                   id="password-input" 
                   placeholder="ENTER PASSWORD"
                   autocomplete="off">
            <div class="error" id="password-error"></div>
            <div class="password-buttons">
                <button class="password-btn" id="submit-btn">
                    🔓 UNLOCK
                </button>
                <button class="password-btn" id="cancel-btn">
                    ✖ CANCEL
                </button>
            </div>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>LOADING SECURE PLAYER...</p>
        <div class="progress-container">
            <div id="load-progress"></div>
        </div>
    </div>

    <!-- VIDEO CONTAINER -->
    <div id="video-container">
        <div id="video-wrapper">
            <!-- Video embed will be loaded here -->
        </div>
    </div>

    <!-- CONTROLS -->
    <div id="controls">
        <button class="control-btn" onclick="toggleFullscreen()">
            ⛶ FULLSCREEN
        </button>
        <button class="control-btn" onclick="exitPlayer()">
            🚪 EXIT
        </button>
    </div>

    <!-- SECURITY INFO -->
    <div id="security-info"></div>

    <script>
    // ===========================================
    // CORE CONFIGURATION
    // ===========================================
    const API_URL = 'https://architect-johan-secure.onrender.com';
    const STATE = {
        videoLoaded: false,
        sessionToken: null,
        recordingDetected: false,
        violations: 0,
        maxViolations: 5,
        debugMode: false,
        intervals: []
    };

    // ===========================================
    // DEBUG FUNCTIONS
    // ===========================================
    function toggleDebug() {
        STATE.debugMode = !STATE.debugMode;
        document.getElementById('debug-panel').style.display = 
            STATE.debugMode ? 'block' : 'none';
        logDebug('Debug mode ' + (STATE.debugMode ? 'enabled' : 'disabled'), 'info');
    }

    function logDebug(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        console.log(`[${timestamp}] ${type.toUpperCase()}: ${message}`);
        
        if (STATE.debugMode) {
            const debugLog = document.getElementById('debug-log');
            const item = document.createElement('div');
            item.className = `debug-item ${type}`;
            item.textContent = `[${timestamp}] ${message}`;
            debugLog.appendChild(item);
            
            // Keep only last 15 logs
            const items = debugLog.querySelectorAll('.debug-item');
            if (items.length > 15) {
                debugLog.removeChild(items[0]);
            }
        }
    }

    // ===========================================
    // ACCURATE EXTENSION DETECTION (NO FALSE POSITIVES)
    // ===========================================
    function initAccurateExtensionDetection() {
        logDebug('Initializing ACCURATE extension detection', 'info');
        
        // Only use reliable methods that don't cause false positives
        setTimeout(() => {
            checkForActiveRecordingExtensions();
            monitorExtensionBehavior();
        }, 3000); // Wait for page to fully load
        
        logDebug('Accurate extension detection ready', 'success');
    }

    function checkForActiveRecordingExtensions() {
        logDebug('Checking for ACTIVE recording extensions...', 'info');
        
        // List of KNOWN recording extensions (only ones that actually record)
        const recordingExtensions = [
            // Only extensions that can actually screen record
            {
                id: 'fmbbmjnjmkcdlhgajjhefpakdflhjlgo',
                name: 'Loom',
                checkMethod: 'api' // Loom has specific APIs
            },
            {
                id: 'pobhoodpcipjmedfenaigbelojhblflp', 
                name: 'Veed Screen Recorder',
                checkMethod: 'resource'
            }
        ];
        
        // Method 1: Check for extension APIs (most reliable)
        checkExtensionAPIs();
        
        // Method 2: Check for extension-specific behaviors
        checkExtensionBehaviors();
        
        // Method 3: Monitor for recording activity
        monitorRecordingActivity();
        
        logDebug('Extension check completed', 'success');
    }

    function checkExtensionAPIs() {
        // Check if specific extension APIs are available
        // This is more reliable than checking resources
        
        // Check for Loom extension
        if (window.loomExtension) {
            triggerExtensionDetection('loom_api', 'Loom extension API detected');
            return;
        }
        
        // Check for common recording extension patterns
        const suspiciousGlobals = [
            'screenRecorder',
            'videoCapture',
            'recorderExtension',
            'captureTab',
            'recordScreen'
        ];
        
        suspiciousGlobals.forEach(globalName => {
            if (window[globalName]) {
                triggerExtensionDetection('global_object', `${globalName} global detected`);
            }
        });
        
        logDebug('No extension APIs detected', 'success');
    }

    function checkExtensionBehaviors() {
        // Look for specific behaviors of recording extensions
        
        // 1. Check for recording buttons/overlays added by extensions
        setTimeout(() => {
            const recordingIndicators = [
                'record-button',
                'screen-record',
                'video-capture',
                'recorder-toolbar',
                'capture-widget'
            ];
            
            recordingIndicators.forEach(className => {
                const elements = document.querySelectorAll(`.${className}, [class*="${className}"], [id*="${className}"]`);
                if (elements.length > 0) {
                    triggerExtensionDetection('recording_ui', `Recording UI detected: ${className}`);
                }
            });
        }, 5000); // Wait longer for extensions to load
        
        // 2. Monitor for recording-related network requests
        if (window.performance && performance.getEntriesByType) {
            const originalFetch = window.fetch;
            window.fetch = function(...args) {
                const url = args[0];
                if (typeof url === 'string') {
                    // Check for recording-related API calls
                    const recordingAPIs = [
                        '/api/record',
                        '/api/capture',
                        '/api/screenshot',
                        '/api/video',
                        'recording',
                        'capture',
                        'screen-record'
                    ];
                    
                    recordingAPIs.forEach(api => {
                        if (url.includes(api)) {
                            logDebug(`Recording API call detected: ${url}`, 'warning');
                            // Don't block immediately, just log
                        }
                    });
                }
                return originalFetch.apply(this, args);
            };
        }
        
        logDebug('Extension behavior monitoring active', 'success');
    }

    function monitorRecordingActivity() {
        // Only trigger when recording actually starts
        
        // Monitor MediaRecorder API
        if (window.MediaRecorder) {
            const originalMediaRecorder = MediaRecorder;
            window.MediaRecorder = function(stream, options) {
                logDebug('MediaRecorder created', 'warning');
                
                // Check if this is for screen recording
                const videoTracks = stream.getVideoTracks();
                videoTracks.forEach(track => {
                    if (track.kind === 'video') {
                        setTimeout(() => {
                            triggerExtensionDetection('media_recorder', 'Screen recording started via MediaRecorder');
                        }, 1000);
                    }
                });
                
                return new originalMediaRecorder(stream, options);
            };
        }
        
        // Monitor canvas capture
        if (HTMLCanvasElement.prototype.captureStream) {
            const originalCaptureStream = HTMLCanvasElement.prototype.captureStream;
            HTMLCanvasElement.prototype.captureStream = function(fps) {
                logDebug('Canvas captureStream called', 'warning');
                
                // Check if this is likely for recording
                if (this.width > 1280 || this.height > 720) {
                    triggerExtensionDetection('canvas_capture', 'Large canvas capture (possible recording)');
                }
                
                return originalCaptureStream.call(this, fps);
            };
        }
        
        logDebug('Recording activity monitoring active', 'success');
    }

    function triggerExtensionDetection(method, details) {
        // Only trigger black screen for HIGH confidence detections
        const highConfidence = [
            'media_recorder',
            'screen_sharing',
            'canvas_capture',
            'loom_api'
        ];
        
        if (!highConfidence.includes(method)) {
            logDebug(`Low confidence extension detection (ignored): ${method} - ${details}`, 'warning');
            return;
        }
        
        logDebug(`EXTENSION DETECTED: ${method} - ${details}`, 'error');
        triggerBlackScreen('extension', `${method}: ${details}`);
    }

    // ===========================================
    // SCREENSHOT & RECORDING DETECTION
    // ===========================================
    function initScreenshotDetection() {
        logDebug('Initializing screenshot detection', 'info');
        
        // Block screenshot keys (reliable)
        blockScreenshotKeys();
        
        // Block screen recording APIs
        blockScreenRecordingAPIs();
        
        logDebug('Screenshot detection active', 'success');
    }

    function blockScreenshotKeys() {
        document.addEventListener('keydown', function(e) {
            // Print Screen
            if (e.key === 'PrintScreen' || e.keyCode === 44) {
                e.preventDefault();
                e.stopPropagation();
                triggerBlackScreen('print_screen', 'Print Screen key pressed');
                return false;
            }
            
            // Windows + Shift + S
            if ((e.key === 's' || e.key === 'S') && e.shiftKey && 
                (navigator.platform.includes('Win') ? e.ctrlKey : e.metaKey)) {
                e.preventDefault();
                e.stopPropagation();
                triggerBlackScreen('snipping_tool', 'Win+Shift+S pressed');
                return false;
            }
            
            // Mac Screenshot
            if (e.metaKey && e.shiftKey && (e.key === '3' || e.key === '4')) {
                e.preventDefault();
                e.stopPropagation();
                triggerBlackScreen('mac_screenshot', `Cmd+Shift+${e.key} pressed`);
                return false;
            }
        }, true);
    }

    function blockScreenRecordingAPIs() {
        // Block getDisplayMedia
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            const originalGetDisplayMedia = navigator.mediaDevices.getDisplayMedia;
            navigator.mediaDevices.getDisplayMedia = function(constraints) {
                logDebug('Screen recording API accessed', 'error');
                triggerBlackScreen('screen_recording', 'Screen recording attempted via getDisplayMedia');
                return Promise.reject(new Error('Screen recording blocked'));
            };
        }
        
        // Monitor for browser recording
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const originalGetUserMedia = navigator.mediaDevices.getUserMedia;
            navigator.mediaDevices.getUserMedia = function(constraints) {
                if (constraints && constraints.video === 'screen' || 
                    (constraints.video && constraints.video.mediaSource === 'screen')) {
                    logDebug('Screen capture via getUserMedia', 'error');
                    triggerBlackScreen('screen_capture', 'Screen capture via getUserMedia');
                }
                return originalGetUserMedia.call(this, constraints);
            };
        }
    }

    // ===========================================
    // OBS DETECTION (RELIABLE ONLY)
    // ===========================================
    function initOBSDetection() {
        logDebug('Initializing OBS detection', 'info');
        
        // Only reliable OBS detection methods
        checkForOBSVirtualCamera();
        checkForOBSBrowserSource();
        
        logDebug('OBS detection active', 'success');
    }

    function checkForOBSVirtualCamera() {
        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
            navigator.mediaDevices.enumerateDevices()
                .then(devices => {
                    devices.forEach(device => {
                        const label = device.label.toLowerCase();
                        // Only trigger on exact OBS camera
                        if (label === 'obs virtual camera' || label.includes('obs-camera')) {
                            triggerBlackScreen('obs_camera', 'OBS Virtual Camera detected');
                        }
                    });
                })
                .catch(() => {});
        }
    }

    function checkForOBSBrowserSource() {
        // Check if page is loaded in OBS browser source
        try {
            // OBS browser source often has specific URL patterns
            if (window.location.href.includes('obs://') || 
                document.referrer.includes('obsproject.com')) {
                triggerBlackScreen('obs_browser_source', 'OBS Browser Source detected');
                return;
            }
            
            // Check for OBS in window properties
            if (window.name && window.name.toLowerCase().includes('obs')) {
                triggerBlackScreen('obs_window', `Window name: ${window.name}`);
                return;
            }
            
        } catch (e) {
            // Ignore errors
        }
    }

    // ===========================================
    // BLACK SCREEN SYSTEM
    // ===========================================
    function triggerBlackScreen(type, details) {
        if (STATE.recordingDetected) return;
        
        STATE.recordingDetected = true;
        STATE.violations++;
        
        logDebug(`Black screen triggered - ${type}: ${details}`, 'error');
        
        // Show black screen
        document.getElementById('detection-details').textContent = details;
        document.getElementById('black-screen').classList.add('active');
        
        if (STATE.videoLoaded) {
            document.getElementById('video-container').classList.remove('active');
            document.getElementById('controls').classList.remove('active');
            document.getElementById('video-wrapper').innerHTML = '';
        }
        
        // Start auto-resume timer (30 seconds)
        let resumeTime = 30;
        const timerElement = document.getElementById('resume-timer');
        timerElement.textContent = resumeTime;
        
        const timerInterval = setInterval(() => {
            resumeTime--;
            timerElement.textContent = resumeTime;
            
            if (resumeTime <= 0) {
                clearInterval(timerInterval);
                stopRecordingDetection();
            }
        }, 1000);
        
        STATE.intervals.push(timerInterval);
        
        // Log to server
        sendSecurityLog({
            type: 'security_alert',
            method: type,
            details: details,
            violations: STATE.violations,
            timestamp: new Date().toISOString()
        });
    }

    function stopRecordingDetection() {
        if (!STATE.recordingDetected) return;
        
        STATE.recordingDetected = false;
        
        logDebug('Clearing black screen, resuming video', 'info');
        
        document.getElementById('black-screen').classList.remove('active');
        
        if (STATE.violations < STATE.maxViolations) {
            setTimeout(() => {
                if (STATE.videoLoaded && STATE.sessionToken) {
                    document.getElementById('video-container').classList.add('active');
                    document.getElementById('controls').classList.add('active');
                    loadVideoContent(); // Reload video
                    showSecurityInfo(`✅ Video resumed`);
                }
            }, 1000);
        }
    }

    // ===========================================
    // MAIN INITIALIZATION
    // ===========================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log("🔒 Secure Video Player Initializing...");
        
        // Setup debug
        document.getElementById('debug-toggle').addEventListener('click', toggleDebug);
        
        // Check authentication
        const token = localStorage.getItem('auth_token');
        if (!token) {
            alert('Please login to access videos');
            window.location.href = 'index.html';
            return;
        }
        
        // Show password modal
        document.getElementById('password-modal').style.display = 'flex';
        
        // Setup password form
        document.getElementById('submit-btn').addEventListener('click', verifyPassword);
        document.getElementById('cancel-btn').addEventListener('click', function() {
            window.location.href = 'home.html';
        });
        
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPassword();
        });
        
        setTimeout(() => {
            document.getElementById('password-input').focus();
        }, 100);
        
        // Check existing session
        const sessionToken = localStorage.getItem('video_session_token');
        if (sessionToken) {
            STATE.sessionToken = sessionToken;
            document.getElementById('password-modal').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';
            setTimeout(() => {
                loadVideoContent();
            }, 1000);
        }
        
        logDebug('Player initialized', 'success');
    });

    function updateProgress(percent) {
        const progress = document.getElementById('load-progress');
        if (progress) {
            progress.style.width = percent + '%';
        }
    }

    async function verifyPassword() {
        const password = document.getElementById('password-input').value.trim();
        const errorElement = document.getElementById('password-error');
        
        errorElement.style.display = 'none';
        
        if (!password) {
            showError('Password is required');
            return;
        }

        try {
            updateProgress(30);
            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            updateProgress(60);
            const response = await fetch(`${API_URL}/api/secure-video/verify`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: password })
            });

            updateProgress(90);
            const data = await response.json();

            if (data.success) {
                STATE.sessionToken = data.session_token;
                localStorage.setItem('video_session_token', data.session_token);
                document.getElementById('password-modal').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';
                updateProgress(100);
                setTimeout(() => {
                    loadVideoContent();
                }, 500);
            } else {
                showError(data.error || 'Invalid password');
                document.getElementById('password-input').value = '';
                updateProgress(0);
            }
        } catch (error) {
            showError('Network error');
            updateProgress(0);
        }
    }

    async function loadVideoContent() {
        try {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            const response = await fetch(`${API_URL}/api/secure-video/get-embed`, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-Session-Token': STATE.sessionToken || ''
                }
            });

            const data = await response.json();

            if (data.success && data.embed) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('video-wrapper').innerHTML = data.embed;
                document.getElementById('video-container').classList.add('active');
                document.getElementById('controls').classList.add('active');
                STATE.videoLoaded = true;
                
                // Initialize ACCURATE detection systems
                initAccurateExtensionDetection();
                initScreenshotDetection();
                initOBSDetection();
                
                showSecurityInfo('✅ Video loaded');
                logDebug('Video loaded successfully', 'success');
            } else {
                throw new Error(data.error || 'Failed to load video');
            }
        } catch (error) {
            console.error('Video loading error:', error);
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('password-modal').style.display = 'flex';
            showError('Failed to load video');
            STATE.sessionToken = null;
            localStorage.removeItem('video_session_token');
            logDebug('Video load failed: ' + error.message, 'error');
        }
    }

    function showError(message) {
        const errorElement = document.getElementById('password-error');
        errorElement.textContent = message;
        errorElement.style.display = 'block';
    }

    function showSecurityInfo(message) {
        const info = document.getElementById('security-info');
        if (info) {
            info.textContent = message;
            info.style.color = '#00ff00';
            
            setTimeout(() => {
                info.textContent = '🔒 Secure Player Active';
                info.style.color = 'rgba(255, 255, 255, 0.1)';
            }, 3000);
        }
    }

    function toggleFullscreen() {
        const container = document.getElementById('video-container');
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }

    function exitPlayer() {
        if (confirm('Exit video player?')) {
            STATE.intervals.forEach(interval => clearInterval(interval));
            STATE.sessionToken = null;
            STATE.videoLoaded = false;
            localStorage.removeItem('video_session_token');
            window.location.href = 'home.html';
        }
    }

    async function sendSecurityLog(data) {
        try {
            await fetch(`${API_URL}/api/security/log`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } catch (error) {
            console.warn('Failed to send security log');
        }
    }

    // Cleanup
    window.addEventListener('beforeunload', function(e) {
        if (STATE.videoLoaded) {
            e.returnValue = 'You are watching a secure video. Leave?';
        }
    });

    window.addEventListener('unload', function() {
        STATE.intervals.forEach(interval => clearInterval(interval));
    });
    </script>
</body>
</html>
